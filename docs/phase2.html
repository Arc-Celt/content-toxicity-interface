<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Feed Study</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loading">Loading&hellip;</div>
    <div id="error-msg"></div>

    <div id="app">
      <div id="feed-layout">
        <div id="feed-root">
          <div class="post-card">
            <div class="post-header">
              <div class="avatar" id="post-avatar"></div>
              <div>
                <div class="post-author-name" id="post-name"></div>
                <div class="post-author-handle" id="post-handle"></div>
              </div>
            </div>
            <div class="post-title" id="post-title"></div>
            <div id="stim-media"></div>
            <div class="action-bar">
              <button class="action-btn" id="btn-like">
                <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18">
                  <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z" />
                  <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" />
                </svg>
                <span id="like-label">Like</span>
              </button>
              <button class="action-btn" id="btn-reply">
                <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                Reply
              </button>
              <button class="action-btn" id="btn-repost">
                <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18">
                  <path d="M17 1l4 4-4 4" />
                  <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                  <path d="M7 23l-4-4 4-4" />
                  <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                </svg>
                <span id="repost-label">Repost</span>
              </button>
              <button class="action-btn" id="btn-report">
                <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18">
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                  <line x1="4" x2="4" y1="22" y2="15" />
                </svg>
                Report
              </button>
            </div>
            <div class="reply-box">
              <div class="avatar" style="width: 34px; height: 34px; font-size: 13px">Y</div>
              <textarea id="post-reply-input" placeholder="Post your reply" rows="1"></textarea>
              <button class="send-btn" id="post-reply-send">Reply</button>
            </div>
          </div>
          <div class="comment-section">
            <div class="comment-section-title">Comments</div>
            <div id="comment-list"></div>
            <button class="view-more-btn" id="view-more-btn">View more comments</button>
          </div>
        </div>

        <div id="sidebar">
          <div class="sidebar-heading">Recommended</div>
          <div id="reco-list"></div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="report-modal">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title">Report</span>
          <button class="modal-close" id="report-close">&times;</button>
        </div>
        <div id="report-body">
          <p style="font-size: 14px; color: #536471; margin-bottom: 8px">
            Choose the reason that best describes the issue.
          </p>
          <div id="report-reasons"></div>
        </div>
        <div class="report-thanks" id="report-thanks">
          <div class="check">&#10003;</div>
          <div class="msg">Thanks for reporting this</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="app.js"></script>
    <script>
      var SESSION_TYPE = "phase2";
      var CONTINUE_DELAY_MS = 60 * 1000;

      var allItemsCache = [];
      var viewedItemIds = new Set();
      // navigationHistory: [{id, viewedAt, leftAt}]
      var navigationHistory = [];
      var p2SidebarClicks  = []; // [{src, tgt}, …] in order

      // ---- PER-ITEM INTERACTION LOG ----
      // itemLogs[itemId] = { postLiked, postReposted, postReportedReason,
      //   postReplies[], commentReplies[], commentLikes{}, commentReposts{},
      //   commentReports[], commentExpansions }
      var itemLogs = {};

      function getItemLog(itemId) {
        if (!itemLogs[itemId]) {
          itemLogs[itemId] = {
            postLiked:           null,  // null = no interaction
            postReposted:        null,
            postReportedReason:  "",
            postReplies:         [],    // {idx, text, deleted}
            commentReplies:      [],    // {cid, idx, text, deleted}
            commentLikes:        {},    // cid → bool
            commentReposts:      {},    // cid → bool
            commentReports:      [],    // {cid, reason}
            commentExpansions:   0,
          };
        }
        return itemLogs[itemId];
      }

      function trackInteraction(type, data) {
        var log = getItemLog(currentItem.id);
        switch (type) {
          case "post_likes":
            postLiked = data.liked;
            log.postLiked = data.liked;
            break;
          case "post_reposts":
            postReposted = data.reposted;
            log.postReposted = data.reposted;
            break;
          case "post_reports":
            log.postReportedReason = data.reason;
            break;
          case "post_replies":
            log.postReplies.push({ idx: data.reply_index, text: data.body, deleted: false });
            break;
          case "post_reply_interactions":
            var pr = log.postReplies.find(function (r) { return r.idx === data.reply_index; });
            if (pr) {
              if (data.action_type === "edit")   pr.text    = data.value;
              if (data.action_type === "delete") pr.deleted = true;
            }
            break;
          case "comment_expansions":
            log.commentExpansions = data.expansion_index;
            break;
          case "comment_likes":
            log.commentLikes[data.comment_id] = data.liked;
            break;
          case "comment_reposts":
            log.commentReposts[data.comment_id] = data.reposted;
            break;
          case "comment_reports":
            log.commentReports.push({ cid: data.comment_id, reason: data.reason });
            break;
          case "comment_replies":
            log.commentReplies.push({ cid: data.comment_id, idx: data.reply_index, text: data.body, deleted: false });
            break;
          case "comment_reply_interactions":
            var cr = log.commentReplies.find(function (r) {
              return r.cid === data.comment_id && r.idx === data.reply_index;
            });
            if (cr) {
              if (data.action_type === "edit")   cr.text    = data.value;
              if (data.action_type === "delete") cr.deleted = true;
            }
            break;
        }
      }

      async function init() {
        var grpRes = await db
          .from("groups")
          .select("stance, format")
          .eq("group_code", GROUP)
          .single();
        if (grpRes.error || !grpRes.data) {
          showError("Could not load study configuration. Please contact the researcher.");
          return;
        }
        condition = grpRes.data.format;
        var stance = grpRes.data.stance;

        var itemsRes = await db.from("items").select("*").eq("stance", stance);
        if (itemsRes.error || !itemsRes.data || !itemsRes.data.length) {
          showError("Could not load study content. Please contact the researcher.");
          return;
        }
        allItemsCache = itemsRes.data;

        // Phase1 context comes from URL params set by Qualtrics
        var p1ItemId     = params.get("p1_item_id")    || "";
        var p1FirstClick = params.get("p1_first_click") || "";

        if (p1ItemId) viewedItemIds.add(p1ItemId);

        var pool = shuffle(allItemsCache.slice());
        if (p1FirstClick) {
          currentItem = allItemsCache.find(function (i) { return i.id === p1FirstClick; })
            || pool.find(function (i) { return !viewedItemIds.has(i.id); })
            || pool[0];
        } else {
          currentItem = pool.find(function (i) { return !viewedItemIds.has(i.id); }) || pool[0];
        }

        var cmtRes = await db
          .from("comments")
          .select("*")
          .eq("item_id", currentItem.id)
          .order("display_order");
        allComments = cmtRes.data || [];
        allComments.forEach(function (c) {
          commentStates[c.id] = { liked: false, reposted: false, replyCount: 0 };
        });

        loadRecos();

        var now = new Date().toISOString();
        viewedItemIds.add(currentItem.id);
        navigationHistory.push({ id: currentItem.id, viewedAt: now });

        wirePostBar();
        render();
        startContinueTimer();
      }

      function loadRecos() {
        var unviewed = allItemsCache.filter(function (i) {
          return i.id !== currentItem.id && !viewedItemIds.has(i.id);
        });
        recoItems = shuffle(unviewed).slice(0, RECO_COUNT);
      }

      async function navigateTo(itemId) {
        // Close out current item in nav history
        var leftAt = new Date().toISOString();
        navigationHistory[navigationHistory.length - 1].leftAt = leftAt;

        document.getElementById("feed-root").style.opacity = "0.4";

        var itemRes = await db.from("items").select("*").eq("id", itemId).single();
        if (itemRes.error || !itemRes.data) {
          document.getElementById("feed-root").style.opacity = "1";
          return;
        }

        currentItem = itemRes.data;
        viewedItemIds.add(itemId);
        var now = new Date().toISOString();
        navigationHistory.push({ id: itemId, viewedAt: now });

        var cmtRes = await db
          .from("comments")
          .select("*")
          .eq("item_id", itemId)
          .order("display_order");
        allComments = cmtRes.data || [];

        commentStates = {};
        allComments.forEach(function (c) {
          commentStates[c.id] = { liked: false, reposted: false, replyCount: 0 };
        });
        renderedCmtIds = new Set();
        visibleCount = INITIAL_COMMENTS;
        expansionIdx = 0;
        postLiked = false;
        postReposted = false;
        postReplyCount = 0;
        reportTarget = null;

        loadRecos();
        clearFeedDOM();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });

        document.getElementById("feed-root").style.opacity = "1";
      }

      function clearFeedDOM() {
        document.getElementById("comment-list").innerHTML = "";
        var ta = document.getElementById("post-reply-input");
        var send = document.getElementById("post-reply-send");
        ta.value = "";
        ta.style.height = "auto";
        ta.style.minHeight = "38px";
        send.style.display = "none";
        document.getElementById("btn-like").style.color = "#536471";
        document.getElementById("like-label").textContent = "Like";
        document.getElementById("btn-repost").style.color = "#536471";
        document.getElementById("repost-label").textContent = "Repost";
        document.getElementById("btn-report").style.color = "#536471";
      }

      function renderSidebar() {
        var list = document.getElementById("reco-list");
        list.innerHTML = "";
        if (!recoItems.length) {
          list.innerHTML =
            '<p style="color:#536471;font-size:14px;padding:8px 0">You\'ve explored all available posts.</p>';
          return;
        }
        recoItems.forEach(function (item) {
          var card = document.createElement("div");
          card.className = "reco-card";
          var recoUser = (item.author || "?").replace(/^@/, "");
          card.innerHTML =
            '<div class="reco-card-header">' +
            '<div class="reco-avatar">' + esc(recoUser[0].toUpperCase()) + "</div>" +
            '<span class="reco-author">@' + esc(recoUser) + "</span>" +
            "</div>" +
            '<div class="reco-preview">' + esc(recoPreview(item)) + "</div>";
          card.addEventListener("click", function () {
            p2SidebarClicks.push({ src: currentItem.id, tgt: item.id });
            navigateTo(item.id);
          });
          list.appendChild(card);
        });
      }

      function handleContinue() {
        if (continueFired) return;
        continueFired = true;

        // Close out final item in nav history
        var leftAt = new Date().toISOString();
        navigationHistory[navigationHistory.length - 1].leftAt = leftAt;

        // Build p2_nav with seconds per item
        var p2Nav = navigationHistory.map(function (n) {
          var secs = n.leftAt
            ? Math.round((new Date(n.leftAt) - new Date(n.viewedAt)) / 1000)
            : 0;
          return { id: n.id, secs: secs };
        });

        // Flatten per-item logs into embedded-data fields
        var p2PostLikes = {}, p2PostReposts = {}, p2PostReports = [], p2PostReplies = [];
        var p2CmtExp = {}, p2CmtLikes = {}, p2CmtReposts = {};
        var p2CmtReports = [], p2CmtReplies = [];

        Object.keys(itemLogs).forEach(function (id) {
          var log = itemLogs[id];
          if (log.postLiked    !== null) p2PostLikes[id]    = log.postLiked    ? 1 : 0;
          if (log.postReposted !== null) p2PostReposts[id]  = log.postReposted ? 1 : 0;
          if (log.postReportedReason)    p2PostReports.push({ id: id, reason: log.postReportedReason });
          var replies = log.postReplies.filter(function (r) { return !r.deleted; });
          if (replies.length) p2PostReplies.push({ id: id, texts: replies.map(function (r) { return r.text; }) });
          if (log.commentExpansions > 0) p2CmtExp[id] = log.commentExpansions;
          var likedCids = Object.keys(log.commentLikes).filter(function (k) { return log.commentLikes[k]; });
          if (likedCids.length) p2CmtLikes[id] = likedCids;
          var repostedCids = Object.keys(log.commentReposts).filter(function (k) { return log.commentReposts[k]; });
          if (repostedCids.length) p2CmtReposts[id] = repostedCids;
          log.commentReports.forEach(function (r) { p2CmtReports.push({ id: id, cid: r.cid, reason: r.reason }); });
          log.commentReplies.filter(function (r) { return !r.deleted; }).forEach(function (r) {
            p2CmtReplies.push({ id: id, cid: r.cid, text: r.text });
          });
        });

        var payload = {
          p2_nav:                JSON.stringify(p2Nav),
          p2_post_likes:         JSON.stringify(p2PostLikes),
          p2_post_reposts:       JSON.stringify(p2PostReposts),
          p2_post_reports:       JSON.stringify(p2PostReports),
          p2_post_replies:       JSON.stringify(p2PostReplies),
          p2_comment_expansions: JSON.stringify(p2CmtExp),
          p2_comment_likes:      JSON.stringify(p2CmtLikes),
          p2_comment_reposts:    JSON.stringify(p2CmtReposts),
          p2_comment_reports:    JSON.stringify(p2CmtReports),
          p2_comment_replies:    JSON.stringify(p2CmtReplies),
          p2_sidebar_clicks:     JSON.stringify(p2SidebarClicks),
        };

        window.parent.postMessage({ type: "phase2_complete", data: payload }, "*");
      }

      function startContinueTimer() {}

      window.addEventListener("message", function(e) {
        if (!e.data || e.data.type !== "flush_request") return;
        handleContinue();
      });

      init();
    </script>
  </body>
</html>
